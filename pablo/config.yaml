CompileFlags:
  Add:
    - "-std=c++26"
    - "-fparse-all-comments"
    - "--target=x86_64-w64-mingw32"
    - "-Wall"
    - "-Wconversion"
    - "-Wextra"
    - "-pedantic"
    - "-Wshadow"
    - "-Wfloat-equal"
    - "-Wlifetime"
    - "-Wimplicit-fallthrough"
    - "-Wmismatched-new-delete"
    - "-isystem"
    - "C:/DEV/SDKs/abseil/include"
  # CompilationDatabase: Ancestors # ERROR: Matches multiple schemas when only one must validate.
  Compiler: C:\\DEV\\SDKs\\llvmMinGW\\compiler\\bin\\clang++
  BuiltinHeaders: QueryDriver
Index:
  Background: Build
  StandardLibrary: true
Style:
  FullyQualifiedNamespaces: []
Diagnostics:
  ClangTidy:
    Add:
      [
        abseil-*,
        bugprone-*,
        concurrency-*,
        cppcoreguidelines-*,
        google-build-namespaces,
        google-global-names-in-headers,
        google-build-using-namespace,
        google-runtime-operator,
        llvm-header-guard,
        llvm-include-order,
        llvm-prefer-isa-or-dyn-cast-in-conditionals,
        misc-*,
        modernize-*,
        performance-*,
        portability-*,
        readability-*,
        readability-static-accessed-through-instance,
        clang-analyzer-*,
      ]
    Remove:
      [
        misc-use-anonymous-namespace,
        misc-use-internal-linkage,
        cppcoreguidelines-avoid-do-while,
        bugprone-easily-swappable-parameters,
        readability-identifier-length,
        readability-magic-numbers,
        cppcoreguidelines-avoid-magic-numbers,
        readability-trailing-comma,
        cppcoreguidelines-pro-type-reinterpret-cast,
        cppcoreguidelines-pro-bounds-pointer-arithmetic,
        cppcoreguidelines-avoid-c-arrays,
        modernize-avoid-c-arrays,
        misc-non-private-member-variables-in-classes,
        cppcoreguidelines-non-private-member-variables-in-classes,
        cppcoreguidelines-owning-memory
      ]
    CheckOptions:
      readability-identifier-naming.AggressiveDependentMemberLookup: true
      readability-identifier-naming.ClassCase: CamelCase
      readability-identifier-naming.ClassMethodCase: lower_case
      readability-identifier-naming.PublicMemberCase: camelBack
      readability-identifier-naming.PrivateMemberCase: camelBack
      readability-identifier-naming.PrivateMemberSuffix: "_"
      readability-identifier-naming.ProtectedMemberCase: camelBack
      readability-identifier-naming.ProtectedMemberSuffix: "_"
      readability-identifier-naming.ProtectedConstantMemberSuffix: "_"
      readability-identifier-naming.ClassMemberCase: camelBack
      readability-identifier-naming.FunctionCase: lower_case
      readability-identifier-naming.VariableCase: camelBack
      readability-identifier-naming.ConceptCase: CamelCase
      readability-identifier-naming.EnumCase: CamelCase
      readability-identifier-naming.ParameterCase: camelBack
      readability-identifier-naming.EnumConstantCase: CamelCase
      readability-identifier-naming.MacroDefinitionCase: UPPER_CASE
      readability-identifier-naming.NamespaceCase: lower_case
      readability-identifier-naming.MethodCase: lower_case
      readability-identifier-naming.StructCase: CamelCase
      readability-identifier-naming.UnionCase: CamelCase
      readability-identifier-naming.TypedefCase: CamelCase
      readability-identifier-naming.TypeAliasCase: CamelCase
      readability-identifier-naming.ScopedEnumConstantCase: CamelCase
      readability-identifier-naming.TemplateParameterCase: CamelCase
      readability-identifier-naming.ParameterPackCase: camelBack
      readability-identifier-naming.ValueTemplateParameterCase: camelBack
    FastCheckFilter: None
  UnusedIncludes: Strict
  MissingIncludes: Strict
Completion:
  AllScopes: true
  ArgumentLists: FullPlaceholders
  HeaderInsertion: IWYU
  CodePatterns: All
  MacroFilter: ExactPrefix
InlayHints:
  Enabled: true
  ParameterNames: true # function args names and more
  DeducedTypes: true
  Designators: true # at arrays for instance
  BlockEnd: true # block ends
  DefaultArguments: false
  TypeNameLimit: 40
Hover:
  ShowAKA: true
  MacroContentsLimit: 2048 # default: 2048
Documentation:
  CommentFormat: Doxygen
